name: Analysis and model replay

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  reproduce:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      MPLBACKEND: Agg
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            requirements-tested.txt
            analysis/requirements.txt
      - name: Install CPU scientific runtime
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch==2.8.0 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -e '.[dev,plot]' -c requirements-tested.txt
      - name: Verify imported sources
        run: python tools/verify_sources.py
      - name: Test interfaces and analysis definitions
        run: python -m pytest -q
      - name: Regenerate tables, figures, and saved-model predictions
        run: python analysis/reproduce.py --replay-checkpoints
